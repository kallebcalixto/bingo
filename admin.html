<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Painel Admin - Cadastrar Médicos</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root { --primary: #2563eb; --bg: #f8fafc; --surface: #ffffff; --border: #e2e8f0; }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
    body { background: var(--bg); color: #0f172a; padding: 2rem; display: flex; justify-content: center; }
    .card { background: var(--surface); max-width: 600px; width: 100%; padding: 2rem; border-radius: 16px; border: 1px solid var(--border); box-shadow: 0 10px 25px rgba(0,0,0,0.05); }
    h2 { margin-bottom: 1rem; color: var(--primary); }
    .form-group { margin-bottom: 1rem; text-align: left; }
    label { display: block; font-weight: 600; margin-bottom: 0.4rem; font-size: 0.9rem; }
    input, select { width: 100%; padding: 0.8rem; border: 1px solid var(--border); border-radius: 8px; font-size: 1rem; }
    .btn { background: #10b981; color: white; border: none; padding: 0.9rem; border-radius: 8px; font-weight: 700; width: 100%; cursor: pointer; font-size: 1rem; margin-top: 1rem; }
    .btn:hover { background: #059669; }
    .hidden { display: none !important; }
    .error-msg { color: #ef4444; font-size: 0.85rem; margin-top: 0.5rem; display: none; }
  </style>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-app.js";
    import { getFirestore, doc, setDoc } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCOe0Zk1K01zb0lnDAetfLMoBGp2psgMCk",
      authDomain: "bipolar-6f00a.firebaseapp.com",
      projectId: "bipolar-6f00a",
      storageBucket: "bipolar-6f00a.firebasestorage.app",
      messagingSenderId: "380485953198",
      appId: "1:380485953198:web:65b8328ba7f967d3dd2f3f"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    // Palavra-passe configurada para o painel admin
    const ADMIN_PASSWORD = "Sa200783";

    window.checkPassword = (e) => {
      e.preventDefault();
      const inputPass = document.getElementById('admin-password').value;
      const errorEl = document.getElementById('pass-error');

      if (inputPass === ADMIN_PASSWORD) {
        document.getElementById('view-auth').classList.add('hidden');
        document.getElementById('view-form').classList.remove('hidden');
        errorEl.style.display = 'none';
      } else {
        errorEl.style.display = 'block';
      }
    };

    window.addDoctor = async (e) => {
      e.preventDefault();
      const name = document.getElementById('doc-name').value.trim();
      const specialty = document.getElementById('doc-spec').value.trim();
      const crm = document.getElementById('doc-crm').value.trim();
      const uf = document.getElementById('doc-uf').value;
      const photo = document.getElementById('doc-photo').value.trim();
      const whatsapp = document.getElementById('doc-whatsapp').value.trim();

      const docId = "doc_" + Date.now();
      const doctorData = {
        uid: docId,
        name: name,
        specialty: specialty,
        crm: `${crm}/${uf}`,
        photo: photo || `https://ui-avatars.com/api/?name=${encodeURIComponent(name)}&background=2563eb&color=fff`,
        whatsapp: whatsapp,
        createdAt: new Date().toISOString()
      };

      try {
        await setDoc(doc(db, "doctors", docId), doctorData);
        alert("Médico cadastrado com sucesso! Ele já está visível na página principal.");
        document.getElementById('doctor-form').reset();
      } catch (err) {
        alert("Erro ao salvar no Firebase: " + err.message);
      }
    };
  </script>
</head>
<body>

  <div class="card">
    <!-- Tela de Login por Palavra-Passe -->
    <div id="view-auth" style="text-align: center;">
      <h2>Painel Administrativo</h2>
      <p style="margin-bottom: 1.5rem; color: #64748b;">Introduza a palavra-passe para aceder ao cadastro de médicos.</p>

      <form onsubmit="checkPassword(event)">
        <div class="form-group">
          <label>Palavra-passe de Acesso</label>
          <input type="password" id="admin-password" placeholder="Digite a palavra-passe..." required>
          <div id="pass-error" class="error-msg">Palavra-passe incorreta. Tente novamente.</div>
        </div>
        <button type="submit" class="btn" style="background:#2563eb;">Entrar no Painel</button>
      </form>
    </div>

    <!-- Formulário de Cadastro de Médicos Reais -->
    <div id="view-form" class="hidden">
      <h2>⚙️ Cadastrar Novo Médico Real</h2>
      <p style="margin-bottom: 1.5rem; color: #64748b;">Preencha os dados abaixo para publicar diretamente no site principal:</p>
      
      <form id="doctor-form" onsubmit="addDoctor(event)">
        <div class="form-group">
          <label>Nome Completo do Médico *</label>
          <input type="text" id="doc-name" placeholder="Ex: Dr. Carlos Silva" required>
        </div>

        <div class="form-group">
          <label>Especialidade / Área *</label>
          <input type="text" id="doc-spec" placeholder="Ex: Psiquiatria & Acolhimento" required>
        </div>

        <div class="form-group">
          <label>CRM *</label>
          <input type="text" id="doc-crm" placeholder="Ex: 12345" required>
        </div>

        <div class="form-group">
          <label>Estado (UF) *</label>
          <select id="doc-uf">
            <option value="PR">Paraná (PR)</option>
            <option value="SP">São Paulo (SP)</option>
            <option value="RJ">Rio de Janeiro (RJ)</option>
            <option value="SC">Santa Catarina (SC)</option>
            <option value="RS">Rio Grande do Sul (RS)</option>
          </select>
        </div>

        <div class="form-group">
          <label>Link da Foto (URL da Imagem) - Opcional</label>
          <input type="url" id="doc-photo" placeholder="https://site.com/foto.jpg">
        </div>

        <div class="form-group">
          <label>WhatsApp para Contato (Opcional)</label>
          <input type="text" id="doc-whatsapp" placeholder="(41) 99999-9999">
        </div>

        <button type="submit" class="btn">Publicar Médico no Site</button>
      </form>
    </div>
  </div>

</body>
</html>
