<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rede Solidária - Acolhimento</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root { --primary: #2563eb; --bg: #f8fafc; --surface: #ffffff; --border: #e2e8f0; }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
    body { background: var(--bg); color: #0f172a; min-height: 100vh; display: flex; flex-direction: column; }
    header { background: white; border-bottom: 1px solid var(--border); padding: 1rem 2rem; display: flex; justify-content: space-between; align-items: center; }
    .logo { font-size: 1.25rem; font-weight: 700; color: var(--primary); }
    .container { max-width: 900px; margin: 2rem auto; padding: 0 1.5rem; flex: 1; width: 100%; }
    .card { background: var(--surface); border-radius: 16px; padding: 2rem; border: 1px solid var(--border); margin-bottom: 2rem; }
    .btn { background: var(--primary); color: white; padding: 0.8rem 1.5rem; border: none; border-radius: 8px; font-weight: 600; cursor: pointer; width: 100%; }
    .btn-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
    .hidden { display: none !important; }
    .doctor-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 1rem; margin-top: 1rem; }
    .doctor-card { background: white; border: 1px solid var(--border); border-radius: 12px; padding: 1rem; text-align: center; }
    .doctor-avatar { width: 70px; height: 70px; border-radius: 50%; object-fit: cover; margin-bottom: 0.5rem; }
    .chat-box { border: 1px solid var(--border); border-radius: 8px; height: 300px; overflow-y: auto; padding: 1rem; background: #f8fafc; display: flex; flex-direction: column; gap: 0.5rem; margin-bottom: 1rem; }
    .chat-msg { background: white; padding: 0.5rem 0.8rem; border-radius: 8px; border: 1px solid var(--border); max-width: 80%; }
    .chat-msg.self { align-self: flex-end; background: #dbeafe; }
  </style>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-app.js";
    import { getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-auth.js";
    import { getDatabase, ref, onValue, push, get } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCOe0Zk1K01zb0lnDAetfLMoBGp2psgMCk",
      authDomain: "bipolar-6f00a.firebaseapp.com",
      databaseURL: "https://bipolar-6f00a-default-rtdb.firebaseio.com",
      projectId: "bipolar-6f00a",
      storageBucket: "bipolar-6f00a.firebasestorage.app",
      messagingSenderId: "380485953198",
      appId: "1:380485953198:web:65b8328ba7f967d3dd2f3f"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const rtdb = getDatabase(app);
    const googleProvider = new GoogleAuthProvider();

    let currentUser = null;
    let currentRoomId = null;

    onAuthStateChanged(auth, (user) => {
      if (user) {
        currentUser = user;
        document.getElementById('user-name').textContent = user.displayName;
        document.getElementById('user-nav').classList.remove('hidden');
        showScreen(document.getElementById('view-dashboard'));
        loadDoctors();
      } else {
        currentUser = null;
        document.getElementById('user-nav').classList.add('hidden');
        showScreen(document.getElementById('view-auth'));
      }
    });

    window.loginWithGoogle = () => signInWithPopup(auth, googleProvider);
    window.logout = () => signOut(auth);

    function loadDoctors() {
      const container = document.getElementById('doctors-list');
      onValue(ref(rtdb, 'doctors'), (snapshot) => {
        container.innerHTML = "";
        if (!snapshot.exists()) {
          container.innerHTML = "<p style='grid-column: 1/-1;'>Nenhum médico voluntário no momento.</p>";
          return;
        }

        snapshot.forEach((childSnap) => {
          const docData = childSnap.val();
          const docId = childSnap.key;
          const isOnline = docData.isOnline;

          const div = document.createElement('div');
          div.className = "doctor-card";
          div.innerHTML = `
            <img src="${docData.photo}" class="doctor-avatar">
            <div style="font-weight:700;">${docData.name}</div>
            <div style="color:var(--primary); font-size:0.85rem;">${docData.specialty}</div>
            <div style="font-size:0.8rem; color:#64748b; margin-bottom:0.5rem;">CRM: ${docData.crm}</div>
            <div style="font-size:0.8rem; font-weight:bold; color:${isOnline ? '#10b981' : '#94a3b8'}; margin-bottom:0.5rem;">
              ● ${isOnline ? 'ONLINE AGORA' : 'OFFLINE'}
            </div>
            <button class="btn" style="padding:0.4rem; font-size:0.85rem;" onclick="openChatRoom('${docId}', '${docData.name}')">Iniciar Chat</button>
            <button class="btn" style="padding:0.4rem; font-size:0.85rem; background:#7c3aed; margin-top:0.3rem;" onclick="showSchedules('${docId}', '${docData.name}')">📅 Horários</button>
          `;
          container.appendChild(div);
        });
      });
    }

    window.showSchedules = (docId, docName) => {
      get(ref(rtdb, `doctors/${docId}/schedules`)).then((snapshot) => {
        if (!snapshot.exists()) {
          alert(`Dr(a). ${docName} ainda não possui horários cadastrados.`);
          return;
        }
        let txt = `Horários de ${docName}:\n\n`;
        snapshot.forEach(snap => {
          const s = snap.val();
          txt += `• Data: ${s.date} às ${s.time}\n`;
        });
        alert(txt);
      });
    };

    window.openChatRoom = (roomId, roomName) => {
      currentRoomId = roomId;
      document.getElementById('chat-title').textContent = roomName;
      showScreen(document.getElementById('view-chat'));
      listenChat(roomId);
    };

    window.backToDashboard = () => showScreen(document.getElementById('view-dashboard'));

    window.sendMessage = (e) => {
      e.preventDefault();
      const input = document.getElementById('chat-input');
      const text = input.value.trim();
      if (!text || !currentRoomId || !currentUser) return;

      input.value = "";
      push(ref(rtdb, `rooms/${currentRoomId}/messages`), {
        text: text,
        senderId: currentUser.uid,
        senderName: currentUser.displayName || "Usuário",
        timestamp: Date.now()
      });
    };

    function listenChat(roomId) {
      const container = document.getElementById('chat-messages');
      onValue(ref(rtdb, `rooms/${roomId}/messages`), (snapshot) => {
        container.innerHTML = "";
        if (!snapshot.exists()) {
          container.innerHTML = "<p style='text-align:center; color:#64748b;'>Envie uma mensagem...</p>";
          return;
        }

        snapshot.forEach((childSnap) => {
          const msg = childSnap.val();
          const isSelf = msg.senderId === currentUser.uid;
          const time = new Date(msg.timestamp).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

          const div = document.createElement('div');
          div.className = `chat-msg ${isSelf ? 'self' : ''}`;
          div.innerHTML = `
            <div style="font-size:0.75rem; font-weight:bold; color:var(--primary);">${msg.senderName}</div>
            <div>${msg.text}</div>
            <div style="font-size:0.65rem; color:#64748b; text-align:right;">${time}</div>
          `;
          container.appendChild(div);
        });
        container.scrollTop = container.scrollHeight;
      });
    }

    function showScreen(screen) {
      [document.getElementById('view-auth'), document.getElementById('view-dashboard'), document.getElementById('view-chat')].forEach(s => s.classList.add('hidden'));
      screen.classList.remove('hidden');
    }
  </script>
</head>
<body>

  <header>
    <div class="logo">♥ Rede Solidária</div>
    <div id="user-nav" class="hidden" style="display:flex; align-items:center; gap:1rem;">
      <span id="user-name" style="font-weight:600;"></span>
      <button onclick="logout()" style="background:none; border:none; color:#64748b; cursor:pointer;">Sair</button>
    </div>
  </header>

  <div class="container">
    <div id="view-auth" class="card" style="text-align:center;">
      <h2>Rede de Apoio</h2>
      <p style="margin-bottom:1.5rem; color:#64748b;">Acolhimento e orientação profissional.</p>
      <button onclick="loginWithGoogle()" class="btn" style="max-width:250px; margin:0 auto;">Entrar com o Google</button>
    </div>

    <div id="view-dashboard" class="card hidden">
      <h2>Salas Gerais de Apoio</h2>
      <div class="btn-grid" style="margin-bottom: 1.5rem;">
        <button class="btn" onclick="openChatRoom('geral', '💬 Sala Geral')">💬 Sala Geral</button>
        <button class="btn" style="background:#7c3aed;" onclick="openChatRoom('casais', '👩‍❤️‍👨 Espaço Casais')">👩‍❤️‍👨 Espaço Casais</button>
      </div>

      <hr style="border:0; border-top:1px solid var(--border); margin:1.5rem 0;">

      <h2>Médicos Voluntários</h2>
      <div id="doctors-list" class="doctor-grid"></div>
    </div>

    <div id="view-chat" class="card hidden">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:1rem;">
        <h2 id="chat-title">Chat</h2>
        <button onclick="backToDashboard()" class="btn" style="width:auto; padding:0.4rem 1rem; background:#64748b;">← Voltar</button>
      </div>
      <div id="chat-messages" class="chat-box"></div>
      <form onsubmit="sendMessage(event)" style="display:flex; gap:0.5rem;">
        <input type="text" id="chat-input" placeholder="Digite sua mensagem..." style="flex:1; padding:0.8rem; border:1px solid var(--border); border-radius:8px;" required>
        <button type="submit" class="btn" style="width:auto;">Enviar</button>
      </form>
    </div>
  </div>

</body>
</html>
