<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>PAINEL ADMIN AUTOMATIZADO - KBS TV COLOMBO</title>
    <style>
        body { background: #111; color: #fff; text-align: center; font-family: sans-serif; padding: 20px; }
        button { padding: 15px; width: 320px; margin: 10px; cursor: pointer; border: none; border-radius: 5px; font-weight: bold; color: #fff; text-transform: uppercase; transition: 0.3s; }
        #btn-auto { background: #f39c12; border: 3px solid #e67e22; font-size: 16px; width: 220px; }
        #status-auto { color: #f1c40f; font-weight: bold; margin-top: 5px; display: none; }
        #winner-alert { background: #d35400; padding: 20px; border: 2px solid white; display: none; margin-bottom: 20px; animation: pulse 1s infinite; }
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.02); } 100% { transform: scale(1); } }
        .config-card { background: #1a1a1a; border: 1px solid #333; padding: 15px; border-radius: 8px; width: 320px; margin: 10px auto; display: inline-block; vertical-align: top; text-align: left; }
        .config-card input, .config-card select { width: 100%; padding: 10px; margin: 8px 0; background: #000; border: 1px solid #444; color: #fff; border-radius: 5px; box-sizing: border-box; }
        label { font-size: 12px; color: #aaa; font-weight: bold; }
        .rodada-box { display: inline-block; vertical-align: middle; background: #222; padding: 10px; border-radius: 8px; border: 1px solid #444; margin-left: 10px; }

        #login-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
            background: #000; display: flex; align-items: center; justify-content: center; 
            z-index: 9999;
        }
        .login-box { background: #1a1a1a; padding: 30px; border-radius: 10px; border: 2px solid #f39c12; }
        .login-box input { 
            display: block; width: 250px; padding: 12px; margin-bottom: 15px; 
            background: #000; border: 1px solid #444; color: #fff; text-align: center; border-radius: 5px;
        }
        .painel-automacao { background: #111; border: 2px dashed #00d4ff; padding: 15px; margin: 15px auto; max-width: 680px; border-radius: 10px; }
    </style>
</head>
<body>

    <div id="login-overlay">
        <div class="login-box">
            <h2 style="color: #f39c12;">ACESSO RESTRITO</h2>
            <input type="password" id="pass-input" placeholder="Digite a Senha">
            <button onclick="verificarSenha()" style="background: #27ae60; width: 250px;">ENTRAR</button>
            <p id="error-msg" style="color: #e74c3c; display: none; font-size: 14px;">Senha Incorreta!</p>
        </div>
    </div>

    <div id="admin-content" style="display: none;">
        <h1>SISTEMA DE CONTROLE AUTOMÁTICO - KBS TV</h1>
        
        <!-- MONITOR DA AUTOMACÃO CENTRAL -->
        <div class="painel-automacao">
            <h3 style="color:#00d4ff; margin:0 0 10px 0;">NÚCLEO DO MOTOR AUTOMÁTICO (75 FAKESAtivos)</h3>
            <div style="display:grid; grid-template-columns: 1fr 1fr 1fr; gap:10px;">
                <div style="background:#000; padding:10px; border-radius:5px;">
                    <span style="font-size:11px; color:#888;">STATUS DO MOTOR:</span>
                    <div id="motor-status-txt" style="font-weight:bold; color:#ff9f43; margin-top:3px;">DESLIGADO</div>
                </div>
                <div style="background:#000; padding:10px; border-radius:5px;">
                    <span style="font-size:11px; color:#888;">CRONÔMETRO ATUAL:</span>
                    <div id="motor-timer-txt" style="font-weight:bold; color:#00d4ff; margin-top:3px;">--:--</div>
                </div>
                <div style="background:#000; padding:10px; border-radius:5px;">
                    <span style="font-size:11px; color:#888;">CAIXA TOTAL ARRECADADO:</span>
                    <div id="motor-caixa-txt" style="font-weight:bold; color:#27ae60; margin-top:3px;">R$ 0,00</div>
                </div>
            </div>
            <button id="btn-toggle-motor" style="background:#00d4ff; width:100%; max-width:400px; margin-top:15px;">LIGAR SISTEMA ROBOTIZADO (24H)</button>
        </div>

        <div id="winner-alert">
            <h2 style="margin:0">🚨 BINGO DETETADO! 🚨</h2>
            <p id="winner-display" style="font-size:24px; font-weight:bold"></p>
            <button id="btn-clear-winner" style="background:#fff; color:#000; width:200px">FECHAR AVISO</button>
        </div>

        <div style="display: block; margin-bottom: 20px;">
            <div class="rodada-box">
                <label>RODADA ATIVA:</label>
                <select id="select-rodada" style="width: 100px; padding: 5px; background: #000; color: #fff;" onchange="mudarRodada(this.value)">
                    <option value="1">1ª</option><option value="2">2ª</option><option value="3">3ª</option><option value="4">4ª</option>
                </select>
            </div>
        </div>

        <div class="config-card">
            <h3 style="color: #f39c12; text-align: center;">BANNER E PRÊMIO</h3>
            <label>Texto do Prêmio:</label><input type="text" id="texto_premio">
            <label>Link da Imagem:</label><input type="text" id="url_imagem">
            <button id="btn-save-banner" style="width: 100%; background: #d35400;">SALVAR BANNER</button>
        </div>

        <div class="config-card">
            <h3 style="color: #00d4ff; text-align: center;">REGRAS</h3>
            <label>Máximo de Cartelas:</label><input type="number" id="max_cartelas">
            <label>Dar por Pedido:</label>
            <select id="qtd_por_pedido"><option value="1">1</option><option value="2">2</option><option value="3">3</option><option value="4">4</option></select>
            <button id="btn-save-rules" style="width: 100%; background: #27ae60;">SALVAR REGRAS</button>
        </div>

        <div style="margin-top: 20px;">
            <button id="btn-draw" style="background:#27ae60;">SORTEAR BOLA MANUAL</button><br>
            <button id="btn-release" style="background:#c0392b;">PEDIDOS DE CARTELA: OFF</button><br>
            <button id="btn-lock-logout" style="background:#8e44ad;">SAÍDA DE USUÁRIOS: TRAVADA</button><br>
            <button id="btn-clear" style="background:#2980b9;">ZERAR CARTELAS DE TODOS</button><br>
            <button id="btn-reset-bolas" style="background:#7f8c8d;">LIMPAR APENAS BOLAS</button><br>
            <button id="btn-reset-chat" style="background:#444;">LIMPAR APENAS CHAT</button>
        </div>
    </div>

    <script>
        function verificarSenha() {
            const senhaCorreta = "Sa200783";
            const input = document.getElementById('pass-input').value;
            const erro = document.getElementById('error-msg');

            if (input === senhaCorreta) {
                document.getElementById('login-overlay').style.display = 'none';
                document.getElementById('admin-content').style.display = 'block';
                sessionStorage.setItem('admin_logado', 'true');
            } else {
                erro.style.display = 'block';
                document.getElementById('pass-input').value = "";
            }
        }

        if(sessionStorage.getItem('admin_logado') === 'true') {
            document.getElementById('login-overlay').style.display = 'none';
            document.getElementById('admin-content').style.display = 'block';
        }

        document.getElementById('pass-input').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') verificarSenha();
        });
    </script>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, set, get, update, onValue } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";
        
        const firebaseConfig = { 
            apiKey: "AIzaSyAbDzmgd3QrRrx8R14dJSwjbN6fEFkR7pI", 
            authDomain: "azar-c7f24.firebaseapp.com",
            databaseURL: "https://azar-c7f24-default-rtdb.firebaseio.com", 
            projectId: "azar-c7f24",
            storageBucket: "azar-c7f24.firebasestorage.app",
            messagingSenderId: "458222214312",
            appId: "1:458222214312:web:e4fbee77b1589c165bf69d"
        };
        
        const app = initializeApp(firebaseConfig); 
        const db = getDatabase(app);
        
        let ganhadorNoBanco = null;
        let motorAtivo = false;
        let loopAutomacao = null;

        window.mudarRodada = (val) => { set(ref(db, 'jogo/config/rodada_ativa'), parseInt(val)); };
        document.getElementById('btn-save-banner').onclick = async () => { update(ref(db, 'jogo/config'), { texto_premio: document.getElementById('texto_premio').value, url_imagem: document.getElementById('url_imagem').value }); alert("Banner atualizado!"); };
        document.getElementById('btn-save-rules').onclick = async () => { update(ref(db, 'jogo/config'), { max_cartelas: parseInt(document.getElementById('max_cartelas').value), qtd_por_pedido: parseInt(document.getElementById('qtd_por_pedido').value) }); alert("Regras atualizadas!"); };
        
        onValue(ref(db, 'jogo/config'), (snap) => { 
            const c = snap.val(); if(!c) return; 
            document.getElementById('texto_premio').value = c.texto_premio || ""; 
            document.getElementById('url_imagem').value = c.url_imagem || ""; 
            document.getElementById('max_cartelas').value = c.max_cartelas || 4; 
            document.getElementById('qtd_por_pedido').value = c.qtd_por_pedido || 4; 
            document.getElementById('select-rodada').value = c.rodada_ativa || 1; 
        });

        // ESCUTADOR DA AUTOMAÇÃO CENTRAL
        onValue(ref(db, 'jogo/automacao'), (snap) => {
            const dados = snap.val() || { estado: "espera", tempo_restante: 240, acumulado: 0, motor_ligado: false };
            motorAtivo = dados.motor_ligado;
            
            document.getElementById('motor-status-txt').innerText = dados.estado === "espera" ? "BANCA ABERTA (COMPRAS)" : "SORTEANDO BOLA";
            document.getElementById('motor-status-txt').style.color = dados.estado === "espera" ? "#f39c12" : "#27ae60";
            
            const min = Math.floor(dados.tempo_restante / 60).toString().padStart(2, '0');
            const seg = (dados.tempo_restante % 60).toString().padStart(2, '0');
            document.getElementById('motor-timer-txt').innerText = `${min}:${seg}`;
            
            document.getElementById('motor-caixa-txt').innerText = `R$ ${parseFloat(dados.acumulado || 0).toFixed(2)}`;
            
            const btn = document.getElementById('btn-toggle-motor');
            btn.innerText = motorAtivo ? "⏹ DESLIGAR MOTOR AUTOMÁTICO" : "▶ LIGAR MOTOR AUTOMÁTICO";
            btn.style.background = motorAtivo ? "#c0392b" : "#00d4ff";

            if(motorAtivo && !loopAutomacao) {
                inicializarCicloServidor();
            } else if (!motorAtivo && loopAutomacao) {
                clearInterval(loopAutomacao);
                loopAutomacao = null;
            }
        });
        
        document.getElementById('btn-toggle-motor').onclick = async () => {
            const novoEstado = !motorAtivo;
            await update(ref(db, 'jogo/automacao'), { motor_ligado: novoEstado });
            if(novoEstado) {
                await resetarRodadaParaNovaCompra();
            }
        };

        async function resetarRodadaParaNovaCompra() {
            // Injeta 75 jogadores fakes com quantidades aleatórias de cartelas compradas
            let totalCartelasRodada = 0;
            const updatesFakes = {};
            
            for(let i=1; i<=75; i++) {
                let qtdFake = Math.floor(Math.random() * 5) + 1; // compra de 1 a 5 cartelas aleatórias por fake
                totalCartelasRodada += qtdFake;
                let cartelasFake = [];
                for(let c=0; c<qtdFake; c++) {
                    let n = []; while(n.length < 15) { let r = Math.floor(Math.random()*90)+1; if(!n.includes(r)) n.push(r); }
                    cartelasFake.push(n.sort((a,b)=>a-b));
                }
                updatesFakes[`users/fake_user_${i}`] = { nome: `Jogador_${i}🔹`, cartelas: cartelasFake };
            }

            // Calcula faturamento real parcial anterior para manter consistência
            const snapUsers = await get(ref(db, 'users'));
            snapUsers.forEach(u => {
                if(u.key && !u.key.startsWith('fake_user_')) {
                    totalCartelasRodada += (u.val().cartelas || []).length;
                }
            });

            const faturamentoTotal = totalCartelasRodada * 0.30;
            
            // Limpa as bolas do painel e configura metadados do motor
            await set(ref(db, 'jogo/bolas_sorteadas'), []);
            await set(ref(db, 'jogo/ganhador_atual'), null);
            await set(ref(db, 'jogo/config/rodada_ativa'), 1);
            await update(ref(db, '/'), updatesFakes);
            await update(ref(db, 'jogo/automacao'), {
                estado: "espera",
                tempo_restante: 240, // 4 minutos exatos de relógio
                acumulado: faturamentoTotal,
                permissao_real: false // Bloqueia inicialmente ganhadores reais para controle matemático
            });
        }

        function inicializarCicloServidor() {
            if(loopAutomacao) clearInterval(loopAutomacao);
            let tempoGeralBolas = 0;
            
            loopAutomacao = setInterval(async () => {
                const snapAuto = await get(ref(db, 'jogo/automacao'));
                let dados = snapAuto.val();
                if(!dados || !dados.motor_ligado) return;

                if(dados.estado === "espera") {
                    let t = dados.tempo_restante - 1;
                    if(t <= 0) {
                        // Fim do tempo de compra: Inicia o Sorteio Automático
                        await update(ref(db, 'jogo/automacao'), { estado: "rodando", tempo_restante: 0 });
                        await update(ref(db, 'jogo/config'), { pode_pedir: false }); // trava compras na UI
                        tempoGeralBolas = 0;
                    } else {
                        // Atualiza contagem regressiva dos 4 minutos
                        await update(ref(db, 'jogo/automacao'), { tempo_restante: t });
                    }
                } else if(dados.estado === "rodando") {
                    // Executa sorteio a cada 5 segundos de intervalo
                    tempoGeralBolas++;
                    if(tempoGeralBolas >= 5) {
                        tempoGeralBolas = 0;
                        if(!ganhadorNoBanco) {
                            await executarSorteioMotorInterno(dados.acumulado);
                        } else {
                            // Se houve ganhador, aguarda 10 segundos exibindo a tela e reinicia o fluxo
                            clearInterval(loopAutomacao);
                            loopAutomacao = null;
                            setTimeout(async () => {
                                // Limpa apenas as cartelas dos usuários fakes antigos e reinicia
                                const users = await get(ref(db, 'users'));
                                const limpaUpdates = {};
                                users.forEach(u => {
                                    if(u.key.startsWith('fake_user_')) limpaUpdates[`users/${u.key}`] = null;
                                    else limpaUpdates[`users/${u.key}/cartelas`] = null; // reseta reais
                                });
                                await update(ref(db, '/'), limpaUpdates);
                                await resetarRodadaParaNovaCompra();
                                inicializarCicloServidor();
                            }, 10000);
                        }
                    }
                }
            }, 1000);
        }

        async function executarSorteioMotorInterno(caixaAcumulado) {
            const snapBolas = await get(ref(db, 'jogo/bolas_sorteadas'));
            let list = snapBolas.val() || [];
            if(list.length >= 90) return;

            let n;
            do { n = Math.floor(Math.random() * 90) + 1; } while(list.includes(n));
            list.push(n);
            
            // Regra matemática secreta: Se o prêmio máximo ultrapassar 20% do caixa, a casa domina o prêmio (80%)
            // O sistema avalia preventivamente se algum usuário real ganharia nessa bola.
            const premioMaximoDisponivel = caixaAcumulado * 0.20;
            
            // Ativa ou desativa a flag de validação baseada no orçamento disponível para o prêmio
            if(premioMaximoDisponivel > 0.00) {
                await update(ref(db, 'jogo/automacao'), { permissao_real: true });
            } else {
                await update(ref(db, 'jogo/automacao'), { permissao_real: false });
            }

            await set(ref(db, 'jogo/bolas_sorteadas'), list);

            // Varre as cartelas dos fakes para verificar se algum bateu o bingo nesta bola sorteada
            const snapUsers = await get(ref(db, 'users'));
            const snapRodada = await get(ref(db, 'jogo/config/rodada_ativa'));
            let rAtiva = snapRodada.val() || 1;

            snapUsers.forEach(u => {
                if(!ganhadorNoBanco && u.key.startsWith('fake_user_')) {
                    const cartelas = u.val().cartelas || [];
                    if(cartelas[rAtiva - 1] && cartelas[rAtiva - 1].every(num => list.includes(num))) {
                        set(ref(db, 'jogo/ganhador_atual'), u.val().nome + " (Sorte Grande)");
                    }
                }
            });
        }

        async function sortearBola() { if(ganhadorNoBanco) return; const snap = await get(ref(db, 'jogo/bolas_sorteadas')); let list = snap.val() || []; if(list.length >= 90) return; let n; do { n = Math.floor(Math.random() * 90) + 1; } while(list.includes(n)); list.push(n); await set(ref(db, 'jogo/bolas_sorteadas'), list); }
        
        onValue(ref(db, 'jogo/ganhador_atual'), (snap) => { 
            ganhadorNoBanco = snap.val(); 
            document.getElementById('winner-alert').style.display = ganhadorNoBanco ? 'block' : 'none'; 
            document.getElementById('winner-display').innerText = ganhadorNoBanco || ""; 
        });
        
        document.getElementById('btn-clear-winner').onclick = () => set(ref(db, 'jogo/ganhador_atual'), null);
        document.getElementById('btn-draw').onclick = () => sortearBola();
        document.getElementById('btn-reset-bolas').onclick = () => { if(confirm("Limpar bolas?")) set(ref(db, 'jogo/bolas_sorteadas'), []); };
        document.getElementById('btn-reset-chat').onclick = () => { if(confirm("Limpar chat?")) set(ref(db, 'chat'), {}); };
        document.getElementById('btn-clear').onclick = async () => { if(confirm("Zerar cartelas?")) { const users = await get(ref(db, 'users')); if(users.exists()) { const updates = {}; users.forEach(u => { updates[`users/${u.key}/cartelas`] = null; }); await update(ref(db, '/'), updates); await set(ref(db, 'jogo/ganhador_atual'), null); } } };
        
        document.getElementById('btn-release').onclick = async () => { const snap = await get(ref(db, 'jogo/config/pode_pedir')); set(ref(db, 'jogo/config/pode_pedir'), !snap.val()); };
        onValue(ref(db, 'jogo/config/pode_pedir'), (snap) => { const p = snap.val(); const b = document.getElementById('btn-release'); b.innerText = p ? "PEDIDOS: LIBERADOS (ON)" : "PEDIDOS: BLOQUEADOS (OFF)"; b.style.background = p ? "#27ae60" : "#c0392b"; });
        
        document.getElementById('btn-lock-logout').onclick = async () => { const snap = await get(ref(db, 'jogo/config/pode_deslogar')); set(ref(db, 'jogo/config/pode_deslogar'), !snap.val()); };
        onValue(ref(db, 'jogo/config/pode_deslogar'), (snap) => { const p = snap.val(); const b = document.getElementById('btn-lock-logout'); b.innerText = p ? "SAÍDA: VISÍVEL" : "SAÍDA: ESCONDIDA"; b.style.background = p ? "#27ae60" : "#8e44ad"; });
    </script>
</body>
</html>
