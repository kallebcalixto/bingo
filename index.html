<!DOCTYPE html>

<head>
    <meta charset="UTF-8">

    <title>🎰 LAS VEGAS ARCADE - BINGO ROYALE 🎰</title>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        /* CSS MANTIDO IGUAL AO SEU */
        :root { --bg: #050010; --led-magenta: #ff007f; --led-cyan: #00f0ff; --led-yellow: #fffb00; --led-green: #00ff66; }
        body { background: var(--bg); color: #fff; font-family: 'Poppins', sans-serif; margin: 0; padding: 0; }
        #cadastro-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #03000a; z-index: 20000; display: none; flex-direction: column; align-items: center; justify-content: center; }
        .cadastro-box { background: #0f001c; padding: 30px; border-radius: 8px; border: 3px solid var(--led-cyan); max-width: 400px; width: 85%; }
        .cadastro-box input { width: 100%; padding: 12px; margin: 8px 0 16px 0; background: #000; border: 2px solid var(--led-cyan); color: #fff; border-radius: 4px; box-sizing: border-box; }
        .btn-salvar-cad { width: 100%; background: var(--led-green); color: #000; border: none; padding: 12px; border-radius: 4px; font-weight: 900; cursor: pointer; }
    </style>
</head>
<body>

<div id="cadastro-overlay">
    <div class="cadastro-box">
        <h2>DADOS DE PREMIAÇÃO</h2>
        <input type="text" id="cad-whatsapp" placeholder="WhatsApp (DDD+Número)">
        <input type="text" id="cad-cpf" placeholder="CPF">
        <input type="text" id="cad-rua" placeholder="Rua e Número">
        <input type="text" id="cad-bairro" placeholder="Bairro">
        <input type="text" id="cad-pix" placeholder="Sua Chave Pix">
        <button class="btn-salvar-cad" onclick="salvarCadastroPix()">CONFIRMAR DADOS E JOGAR</button>
    </div>
</div>

<script type="module">
    // ... SUAS IMPORTAÇÕES FIREBASE ...
    
    // FUNÇÃO DE SALVAR DADOS ATUALIZADA
    window.salvarCadastroPix = async () => {
        const dados = {
            whatsapp: document.getElementById('cad-whatsapp').value.trim(),
            cpf: document.getElementById('cad-cpf').value.trim(),
            rua: document.getElementById('cad-rua').value.trim(),
            bairro: document.getElementById('cad-bairro').value.trim(),
            pix: document.getElementById('cad-pix').value.trim(),
            nome: auth.currentUser.email.split('@')[0]
        };
        if(Object.values(dados).some(v => v === "")) return alert("Preencha todos os campos!");
        await update(ref(db, `users/${auth.currentUser.uid}`), dados);
        document.getElementById('cadastro-overlay').style.display = 'none';
    };

    // LÓGICA DE LOGIN COM CHECAGEM DE DADOS (ORDEM CORRETA)
    onAuthStateChanged(auth, (user) => {
        if(user) {
            document.getElementById('btn-login-topo').style.display = 'none';
            onValue(ref(db, `users/${user.uid}`), (sUser) => {
                const dadosUser = sUser.val() || {};
                // Se falta CPF (que agora é obrigatório), mostra o overlay
                if(!dadosUser.cpf) {
                    document.getElementById('cadastro-overlay').style.display = 'flex';
                } else {
                    document.getElementById('cadastro-overlay').style.display = 'none';
                }
            });
        }
    });

    // TRAVA DE SEGURANÇA NA VITÓRIA (BLINDAGEM)

        let pctFase = faseAtualDoJogo === 1 ? pctF1 : (faseAtualDoJogo === 2 ? pctF2 : pctF3);
        let valorPremio = (bancaFakeInjetadaDoBanco + caixaReal) * (pctFase / 100);

        // A TRAVA DE OURO: Só libera ganhador real se o PIX REAL for >= (valorPremio * 2)

        } else {
            console.log("Blindagem ativa: Caixa real insuficiente para sorteio real.");
        }
    }
    */
</script>
</body>
</html>
