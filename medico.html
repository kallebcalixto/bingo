<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Área Exclusiva do Médico</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root { --primary: #2563eb; --secondary: #10b981; --bg: #f8fafc; --surface: #ffffff; --border: #e2e8f0; --danger: #ef4444; }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
    body { background: var(--bg); color: #0f172a; padding: 2rem; display: flex; justify-content: center; }
    .card { background: var(--surface); max-width: 600px; width: 100%; padding: 2rem; border-radius: 16px; border: 1px solid var(--border); box-shadow: 0 10px 25px rgba(0,0,0,0.05); }
    h2 { margin-bottom: 0.5rem; color: var(--primary); }
    .form-group { margin-bottom: 1.2rem; text-align: left; }
    label { display: block; font-weight: 600; margin-bottom: 0.4rem; font-size: 0.9rem; }
    input { width: 100%; padding: 0.8rem; border: 1px solid var(--border); border-radius: 8px; font-size: 1rem; }
    .btn { background: var(--primary); color: white; border: none; padding: 0.8rem 1.5rem; border-radius: 8px; font-weight: 700; cursor: pointer; font-size: 1rem; width: 100%; }
    .btn-success { background: var(--secondary); }
    .btn-danger { background: var(--danger); }
    .hidden { display: none !important; }
    .status-box { display: flex; align-items: center; justify-content: space-between; background: #f1f5f9; padding: 1rem; border-radius: 12px; margin-bottom: 1.5rem; }
    .status-dot { width: 12px; height: 12px; border-radius: 50%; display: inline-block; margin-right: 6px; }
    .online { background: var(--secondary); }
    .offline { background: #94a3b8; }
  </style>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-auth.js";
    import { getDatabase, ref, set, update, onValue, push, remove } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCOe0Zk1K01zb0lnDAetfLMoBGp2psgMCk",
      authDomain: "bipolar-6f00a.firebaseapp.com",
      databaseURL: "https://bipolar-6f00a-default-rtdb.firebaseio.com",
      projectId: "bipolar-6f00a",
      storageBucket: "bipolar-6f00a.firebasestorage.app",
      messagingSenderId: "380485953198",
      appId: "1:380485953198:web:65b8328ba7f967d3dd2f3f"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const rtdb = getDatabase(app);

    let currentDoctor = null;

    onAuthStateChanged(auth, (user) => {
      if (user) {
        const docRef = ref(rtdb, 'doctors/' + user.uid);
        
        onValue(docRef, (snapshot) => {
          const data = snapshot.val();
          if (data) {
            currentDoctor = { uid: user.uid, ...data };
          } else {
            const name = user.displayName || user.email.split('@')[0];
            currentDoctor = {
              uid: user.uid,
              name: name,
              specialty: "Médico / Voluntário",
              crm: "CRM Cadastrado",
              isOnline: true,
              photo: `https://ui-avatars.com/api/?name=${encodeURIComponent(name)}&background=2563eb&color=fff`
            };
            set(docRef, currentDoctor);
          }

          document.getElementById('view-auth').classList.add('hidden');
          document.getElementById('view-panel').classList.remove('hidden');
          document.getElementById('doc-welcome-name').textContent = currentDoctor.name;
          updateStatusUI(currentDoctor.isOnline);
          loadSchedules(user.uid);
        });
      } else {
        document.getElementById('view-auth').classList.remove('hidden');
        document.getElementById('view-panel').classList.add('hidden');
      }
    });

    window.loginDoctor = async (e) => {
      e.preventDefault();
      const email = document.getElementById('login-email').value.trim();
      const pass = document.getElementById('login-password').value.trim();
      try {
        await signInWithEmailAndPassword(auth, email, pass);
      } catch (err) {
        alert("Erro ao entrar: Verifique o e-mail e a palavra-passe.");
      }
    };

    window.toggleStatus = () => {
      if (!currentDoctor) return;
      const newStatus = !currentDoctor.isOnline;
      update(ref(rtdb, 'doctors/' + currentDoctor.uid), { isOnline: newStatus });
    };

    function updateStatusUI(isOnline) {
      const dot = document.getElementById('status-dot');
      const text = document.getElementById('status-text');
      const btn = document.getElementById('btn-toggle');

      if (isOnline) {
        dot.className = "status-dot online";
        text.textContent = "ONLINE (Visível no site)";
        btn.textContent = "Ficar OFFLINE";
        btn.className = "btn btn-danger";
      } else {
        dot.className = "status-dot offline";
        text.textContent = "OFFLINE (Inativo)";
        btn.textContent = "Ficar ONLINE";
        btn.className = "btn btn-success";
      }
    }

    window.addSchedule = (e) => {
      e.preventDefault();
      const date = document.getElementById('slot-date').value;
      const time = document.getElementById('slot-time').value;

      const scheduleRef = ref(rtdb, `doctors/${currentDoctor.uid}/schedules`);
      push(scheduleRef, { date, time });
      document.getElementById('schedule-form').reset();
    };

    function loadSchedules(uid) {
      const container = document.getElementById('slots-list');
      const scheduleRef = ref(rtdb, `doctors/${uid}/schedules`);

      onValue(scheduleRef, (snapshot) => {
        container.innerHTML = "";
        if (!snapshot.exists()) {
          container.innerHTML = "<p style='color:#64748b;'>Nenhum horário cadastrado.</p>";
          return;
        }

        snapshot.forEach((childSnap) => {
          const item = childSnap.val();
          const key = childSnap.key;
          const div = document.createElement('div');
          div.style.cssText = "display:flex; justify-content:space-between; align-items:center; background:#f8fafc; padding:0.75rem; border-radius:8px; margin-top:0.5rem; border:1px solid #e2e8f0;";
          div.innerHTML = `
            <div>📅 ${item.date} às ⏰ ${item.time}</div>
            <button onclick="deleteSchedule('${key}')" style="background:none; border:none; color:#ef4444; cursor:pointer; font-weight:bold;">Excluir</button>
          `;
          container.appendChild(div);
        });
      });
    }

    window.deleteSchedule = (key) => {
      remove(ref(rtdb, `doctors/${currentDoctor.uid}/schedules/${key}`));
    };

    window.logout = () => signOut(auth);
  </script>
</head>
<body>

  <div class="card">
    <div id="view-auth">
      <h2>Acesso do Médico</h2>
      <p style="margin-bottom:1.5rem; color:#64748b;">Acesse com a conta criada no Firebase.</p>
      <form onsubmit="loginDoctor(event)">
        <div class="form-group">
          <label>E-mail</label>
          <input type="email" id="login-email" required placeholder="medico@email.com">
        </div>
        <div class="form-group">
          <label>Palavra-passe</label>
          <input type="password" id="login-password" required placeholder="******">
        </div>
        <button type="submit" class="btn">Entrar</button>
      </form>
    </div>

    <div id="view-panel" class="hidden">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:1.5rem;">
        <h2>Olá, <span id="doc-welcome-name"></span></h2>
        <button onclick="logout()" style="background:none; border:none; color:#64748b; cursor:pointer;">Sair</button>
      </div>

      <div class="status-box">
        <div>
          <span id="status-dot" class="status-dot offline"></span>
          <strong id="status-text">OFFLINE</strong>
        </div>
        <button id="btn-toggle" onclick="toggleStatus()" class="btn btn-success" style="width:auto;">Mudar Status</button>
      </div>

      <hr style="border:0; border-top:1px solid var(--border); margin:1.5rem 0;">

      <h3>📅 Horários de Atendimento</h3>
      <form id="schedule-form" onsubmit="addSchedule(event)" style="display:grid; grid-template-columns: 1fr 1fr; gap:1rem; margin-top:1rem; margin-bottom:1.5rem;">
        <div>
          <label>Data</label>
          <input type="date" id="slot-date" required>
        </div>
        <div>
          <label>Horário</label>
          <input type="time" id="slot-time" required>
        </div>
        <button type="submit" class="btn btn-success" style="grid-column: 1 / -1;">Adicionar Horário</button>
      </form>

      <h4>Meus Horários Cadastrados:</h4>
      <div id="slots-list" style="margin-top:0.5rem;"></div>
    </div>
  </div>

</body>
</html>
