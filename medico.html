<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Área Exclusiva do Médico</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root { --primary: #2563eb; --secondary: #10b981; --bg: #f8fafc; --surface: #ffffff; --border: #e2e8f0; --danger: #ef4444; }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
    body { background: var(--bg); color: #0f172a; padding: 2rem; display: flex; justify-content: center; }
    .card { background: var(--surface); max-width: 750px; width: 100%; padding: 2rem; border-radius: 16px; border: 1px solid var(--border); box-shadow: 0 10px 25px rgba(0,0,0,0.05); }
    h2, h3, h4 { color: var(--primary); margin-bottom: 0.5rem; }
    .form-group { margin-bottom: 1.2rem; text-align: left; }
    label { display: block; font-weight: 600; margin-bottom: 0.4rem; font-size: 0.9rem; }
    input { width: 100%; padding: 0.8rem; border: 1px solid var(--border); border-radius: 8px; font-size: 1rem; }
    .btn { background: var(--primary); color: white; border: none; padding: 0.8rem 1.5rem; border-radius: 8px; font-weight: 700; cursor: pointer; font-size: 1rem; width: 100%; }
    .btn-success { background: var(--secondary); }
    .btn-danger { background: var(--danger); }
    .hidden { display: none !important; }
    
    .status-box { display: flex; align-items: center; justify-content: space-between; background: #f1f5f9; padding: 1rem; border-radius: 12px; margin-bottom: 1.5rem; }
    .status-dot { width: 12px; height: 12px; border-radius: 50%; display: inline-block; margin-right: 6px; }
    .online { background: var(--secondary); }
    .offline { background: #94a3b8; }

    .chat-box { border: 1px solid var(--border); border-radius: 8px; height: 260px; overflow-y: auto; padding: 1rem; background: #f8fafc; display: flex; flex-direction: column; gap: 0.5rem; margin-bottom: 0.75rem; }
    .chat-msg { background: white; padding: 0.5rem 0.8rem; border-radius: 8px; border: 1px solid var(--border); max-width: 80%; }
    .chat-msg.self { align-self: flex-end; background: #dbeafe; }
    .patient-card { padding: 0.8rem; background: #f1f5f9; border: 1px solid var(--border); border-radius: 8px; margin-bottom: 0.5rem; cursor: pointer; display: flex; justify-content: space-between; align-items: center; }
    .patient-card:hover { background: #e2e8f0; }
  </style>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-auth.js";
    import { getDatabase, ref, set, update, onValue, push, remove, get } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCOe0Zk1K01zb0lnDAetfLMoBGp2psgMCk",
      authDomain: "bipolar-6f00a.firebaseapp.com",
      databaseURL: "https://bipolar-6f00a-default-rtdb.firebaseio.com",
      projectId: "bipolar-6f00a",
      storageBucket: "bipolar-6f00a.firebasestorage.app",
      messagingSenderId: "380485953198",
      appId: "1:380485953198:web:65b8328ba7f967d3dd2f3f"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const rtdb = getDatabase(app);

    let currentDoctor = null;
    let activeRoomId = null;

    onAuthStateChanged(auth, async (user) => {
      if (user) {
        const emailKey = user.email.toLowerCase().replace(/[^a-zA-Z0-9]/g, "_");
        const docRef = ref(rtdb, 'doctors/' + emailKey);

        const snapshot = await get(docRef);

        if (snapshot.exists()) {
          currentDoctor = { key: emailKey, ...snapshot.val() };
          document.getElementById('view-auth').classList.add('hidden');
          document.getElementById('view-panel').classList.remove('hidden');
          document.getElementById('doc-welcome-name').textContent = currentDoctor.name;
          updateStatusUI(currentDoctor.isOnline);
          loadSchedules(emailKey);
          loadPatientMessages(emailKey);
        } else {
          alert("Acesso recusado: Este e-mail não possui cadastro no Painel Admin.");
          signOut(auth);
        }
      } else {
        document.getElementById('view-auth').classList.remove('hidden');
        document.getElementById('view-panel').classList.add('hidden');
      }
    });

    window.loginDoctor = async (e) => {
      e.preventDefault();
      const email = document.getElementById('login-email').value.trim();
      const pass = document.getElementById('login-password').value.trim();
      try {
        await signInWithEmailAndPassword(auth, email, pass);
      } catch (err) {
        alert("Erro no login: Verifique e-mail e palavra-passe.");
      }
    };

    window.toggleStatus = () => {
      if (!currentDoctor) return;
      const newStatus = !currentDoctor.isOnline;
      update(ref(rtdb, 'doctors/' + currentDoctor.key), { isOnline: newStatus });
      currentDoctor.isOnline = newStatus;
      updateStatusUI(newStatus);
    };

    function updateStatusUI(isOnline) {
      const dot = document.getElementById('status-dot');
      const text = document.getElementById('status-text');
      const btn = document.getElementById('btn-toggle');

      if (isOnline) {
        dot.className = "status-dot online";
        text.textContent = "ONLINE (Disponível no site)";
        btn.textContent = "Mudar para OFFLINE";
        btn.className = "btn btn-danger";
      } else {
        dot.className = "status-dot offline";
        text.textContent = "OFFLINE (Inativo)";
        btn.textContent = "Mudar para ONLINE";
        btn.className = "btn btn-success";
      }
    }

    window.addSchedule = (e) => {
      e.preventDefault();
      const date = document.getElementById('slot-date').value;
      const time = document.getElementById('slot-time').value;

      push(ref(rtdb, `doctors/${currentDoctor.key}/schedules`), { date, time });
      document.getElementById('schedule-form').reset();
    };

    function loadSchedules(emailKey) {
      const container = document.getElementById('slots-list');
      onValue(ref(rtdb, `doctors/${emailKey}/schedules`), (snapshot) => {
        container.innerHTML = "";
        if (!snapshot.exists()) {
          container.innerHTML = "<p style='color:#64748b;'>Nenhum horário cadastrado ainda.</p>";
          return;
        }

        snapshot.forEach((childSnap) => {
          const item = childSnap.val();
          const key = childSnap.key;
          const div = document.createElement('div');
          div.style.cssText = "display:flex; justify-content:space-between; align-items:center; background:#f8fafc; padding:0.6rem 0.8rem; border-radius:8px; margin-top:0.4rem; border:1px solid #e2e8f0;";
          div.innerHTML = `
            <div>📅 ${item.date} às ⏰ ${item.time}</div>
            <button onclick="deleteSchedule('${key}')" style="background:none; border:none; color:#ef4444; cursor:pointer; font-weight:bold;">Excluir</button>
          `;
          container.appendChild(div);
        });
      });
    }

    window.deleteSchedule = (key) => {
      remove(ref(rtdb, `doctors/${currentDoctor.key}/schedules/${key}`));
    };

    function loadPatientMessages(emailKey) {
      const container = document.getElementById('patient-list');
      onValue(ref(rtdb, 'rooms'), (snapshot) => {
        container.innerHTML = "";
        if (!snapshot.exists()) {
          container.innerHTML = "<p style='color:#64748b;'>Nenhuma mensagem de paciente recebida ainda.</p>";
          return;
        }

        let totalChats = 0;
        snapshot.forEach((roomSnap) => {
          const roomId = roomSnap.key;

          if (roomId.includes(emailKey)) {
            totalChats++;
            const messages = roomSnap.child('messages').val();
            let lastMsg = "Nova dúvida recebida";
            let patientName = "Paciente";

            if (messages) {
              const msgKeys = Object.keys(messages);
              const lastObj = messages[msgKeys[msgKeys.length - 1]];
              lastMsg = lastObj.text;
              patientName = lastObj.senderName || "Paciente";
            }

            const div = document.createElement('div');
            div.className = "patient-card";
            div.innerHTML = `
              <div>
                <strong>💬 ${patientName}</strong>
                <div style="font-size:0.85rem; color:#64748b; margin-top:0.2rem;">"${lastMsg}"</div>
              </div>
              <button class="btn" style="width:auto; padding:0.4rem 0.8rem; font-size:0.85rem;" onclick="openPatientChat('${roomId}')">Responder</button>
            `;
            container.appendChild(div);
          }
        });

        if (totalChats === 0) {
          container.innerHTML = "<p style='color:#64748b;'>Nenhuma conversa iniciada por pacientes no momento.</p>";
        }
      });
    }

    window.openPatientChat = (roomId) => {
      activeRoomId = roomId;
      document.getElementById('chat-container').classList.remove('hidden');
      
      onValue(ref(rtdb, `rooms/${roomId}/messages`), (snapshot) => {
        const container = document.getElementById('chat-messages');
        container.innerHTML = "";
        if (!snapshot.exists()) return;

        snapshot.forEach((childSnap) => {
          const msg = childSnap.val();
          const isSelf = msg.senderId === currentDoctor.key;
          const time = new Date(msg.timestamp).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

          const div = document.className = `chat-msg ${isSelf ? 'self' : ''}`;
          const elem = document.createElement('div');
          elem.className = `chat-msg ${isSelf ? 'self' : ''}`;
          elem.innerHTML = `
            <div style="font-size:0.75rem; font-weight:bold; color:var(--primary);">${msg.senderName}</div>
            <div>${msg.text}</div>
            <div style="font-size:0.65rem; color:#64748b; text-align:right;">${time}</div>
          `;
          container.appendChild(elem);
        });
        container.scrollTop = container.scrollHeight;
      });
    };

    window.replyMessage = (e) => {
      e.preventDefault();
      const input = document.getElementById('chat-input');
      const text = input.value.trim();
      if (!text || !activeRoomId || !currentDoctor) return;

      input.value = "";
      push(ref(rtdb, `rooms/${activeRoomId}/messages`), {
        text: text,
        senderId: currentDoctor.key,
        senderName: `Dr(a). ${currentDoctor.name}`,
        timestamp: Date.now()
      });
    };

    window.logout = () => signOut(auth);
  </script>
</head>
<body>

  <div class="card">
    <div id="view-auth">
      <h2>Acesso do Médico</h2>
      <p style="margin-bottom:1.5rem; color:#64748b;">Insira o e-mail e a palavra-passe cadastrados no Firebase.</p>
      <form onsubmit="loginDoctor(event)">
        <div class="form-group">
          <label>E-mail Cadastrado</label>
          <input type="email" id="login-email" required placeholder="medico@email.com">
        </div>
        <div class="form-group">
          <label>Palavra-passe</label>
          <input type="password" id="login-password" required placeholder="******">
        </div>
        <button type="submit" class="btn">Entrar na Área do Médico</button>
      </form>
    </div>

    <div id="view-panel" class="hidden">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:1.5rem;">
        <h2>Olá, <span id="doc-welcome-name"></span></h2>
        <button onclick="logout()" style="background:none; border:none; color:#64748b; cursor:pointer; font-weight:600;">Sair</button>
      </div>

      <div class="status-box">
        <div>
          <span id="status-dot" class="status-dot offline"></span>
          <strong id="status-text">OFFLINE</strong>
        </div>
        <button id="btn-toggle" onclick="toggleStatus()" class="btn btn-success" style="width:auto;">Mudar Status</button>
      </div>

      <hr style="border:0; border-top:1px solid var(--border); margin:1.5rem 0;">

      <h3>📅 Meus Horários Disponíveis</h3>
      <form id="schedule-form" onsubmit="addSchedule(event)" style="display:grid; grid-template-columns: 1fr 1fr; gap:1rem; margin-top:0.5rem; margin-bottom:1rem;">
        <div>
          <label>Data</label>
          <input type="date" id="slot-date" required>
        </div>
        <div>
          <label>Horário</label>
          <input type="time" id="slot-time" required>
        </div>
        <button type="submit" class="btn btn-success" style="grid-column: 1 / -1;">Adicionar Horário</button>
      </form>

      <div id="slots-list" style="margin-bottom:1.5rem;"></div>

      <hr style="border:0; border-top:1px solid var(--border); margin:1.5rem 0;">

      <h3>💬 Mensagens Recebidas dos Pacientes</h3>
      <div id="patient-list" style="margin-top:0.5rem; margin-bottom:1rem;"></div>

      <div id="chat-container" class="hidden">
        <h4>Caixa de Resposta:</h4>
        <div id="chat-messages" class="chat-box"></div>
        <form onsubmit="replyMessage(event)" style="display:flex; gap:0.5rem;">
          <input type="text" id="chat-input" placeholder="Digite sua resposta..." style="flex:1; padding:0.8rem; border:1px solid var(--border); border-radius:8px;" required>
          <button type="submit" class="btn" style="width:auto;">Enviar Resposta</button>
        </form>
      </div>

    </div>
  </div>

</body>
</html>
